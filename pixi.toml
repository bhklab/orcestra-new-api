[project]
name = "orcestra-new-api"
version = "0.1.0"
description = "Add a short description here"
authors = ["mattbocc <matthew.boccalon@live.ca>"]
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64", "win-64", "linux-64"]

[dependencies]
fastapi = ">=0.129.0,<0.130"
uvicorn = ">=0.41.0,<0.42"
git = ">=2.53.0,<3"
motor = ">=3.7.1,<4"
pymongo = ">=4.16.0,<5"
python-dotenv = ">=1.2.1,<2"
aiohttp = ">=3.13.3,<4"
gitpython = ">=3.1.46,<4"
pyyaml = ">=6.0.3,<7"
conda = ">=26.1.0,<27"
snakemake = ">=9.16.3,<10"
email-validator = ">=2.3.0,<3"
colorlog = ">=6.10.1,<7"
sendgrid = ">=6.12.5,<7"

[tasks]
start = "uvicorn api.main:app --reload --reload-dir api"
